name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python tests/test_reconscope.py
      - name: Smoke-test the CLI (offline demo)
        run: |
          python cli.py securebank.example --demo --json
          python cli.py acme-shop.example --demo --no-color
